include source/simulations/omnetpp.ini

[Config Review_E4_A_LoS]
extends = Thesis_A10_LoS_25m
*.tracer.gridOutputCsv = "${resultdir}/Review_E4_A_LoS-grid.csv"
*.tracer.outputCsv = "${resultdir}/Review_E4_A_LoS-rays.csv"

[Config Review_E4_B_R1]
extends = Thesis_A11_LoS_R1_25m
*.tracer.gridOutputCsv = "${resultdir}/Review_E4_B_R1-grid.csv"
*.tracer.outputCsv = "${resultdir}/Review_E4_B_R1-rays.csv"

[Config Review_E4_C_R1R2]
extends = Thesis_A11_LoS_R1_25m
*.tracer.enableSecondOrderReflections = true
*.tracer.enableDiffraction = false
*.tracer.gridOutputCsv = "${resultdir}/Review_E4_C_R1R2-grid.csv"
*.tracer.outputCsv = "${resultdir}/Review_E4_C_R1R2-rays.csv"

[Config Review_E4_D_FULL]
extends = Thesis_A12_FULL_25m
*.tracer.gridOutputCsv = "${resultdir}/Review_E4_D_FULL-grid.csv"
*.tracer.outputCsv = "${resultdir}/Review_E4_D_FULL-rays.csv"

[Config Review_M10_FULL]
extends = Thesis_M10_FULL_10m


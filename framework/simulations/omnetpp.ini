# Grid-density sensitivity.  These runs use the same physics and area.
# For the 210 m x 210 m synthetic extent the approximate sample counts are:
#   20 m step -> 11 x 11 = 121 receivers
#   10 m step -> 22 x 22 = 484 receivers (UrbanBase)
#    5 m step -> 43 x 43 = 1849 receivers
# R2 tests ordered wall pairs at every receiver, so finer grids can increase
# runtime quickly even though no angular ray-launch discretization is used.
[Config Urban11_Grid20m]
extends = Urban05_Full
description = "Sensitivity: coarser 20 m receiver grid"
*.tracer.gridStepX = 20m
*.tracer.gridStepY = 20m
*.tracer.gridOutputCsv = "${resultdir}/Urban11_Grid20m-grid.csv"
*.tracer.outputCsv = "${resultdir}/Urban11_Grid20m-rays.csv"

[Config Urban12_Grid5m]

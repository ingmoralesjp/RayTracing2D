description = "Sensitivity: retain only the strongest 16 valid paths per receiver"
*.tracer.maxPathsPerReceiver = 16
*.tracer.gridOutputCsv = "${resultdir}/Urban15_MaxPaths16-grid.csv"
*.tracer.outputCsv = "${resultdir}/Urban15_MaxPaths16-rays.csv"

# ============================================================================
# STUDENT MAP - ZACATECAS COORDINATE / VISUAL CHECKS
#
# Source file:
#   simulations/data/student/zacatecas_student.osm
#
# OSM bounds:
#   lat 22.7569500 .. 22.7797800
#   lon -102.6002500 .. -102.5596000
#
# For this project the OSM projection origin is deliberately the SOUTH-WEST
# corner of those bounds. Therefore imported world coordinates are approximately:
#   X = 0 .. 4168.21 m  (east-positive)
#   Y = 0 .. 2538.58 m  (north-positive)
#
# The original thesis GW coordinate
#   lat=22.761356667994857, lon=-102.58256162532065
# projects to approximately
#   X=1813.748 m, Y=490.000 m.
#
# The supported building geometry itself spans approximately
#   X=-12.60 .. 3881.60 m
#   Y=-38.28 .. 2497.72 m
# because a few dependency nodes lie slightly outside the declared <bounds>.
#
# NOTE: that horizontal coordinate lies inside overlapping OSM building
# footprints. In this strictly 2D model a terminal inside a building footprint
# is treated as geometrically obstructed unless wall transmission/3D rooftop
# semantics are later introduced. For R1/R2 demonstrations below, an open-air
# TX a few tens of metres away is therefore used explicitly and documented.
# ============================================================================

[Config UrbanStudentMapImportCheck]
extends = UrbanBase
description = "v1.5.1 full Zacatecas OSM import + north-up Qtenv auto-fit; no grid/reflections"
*.tracer.osmFile = "data/student/zacatecas_student.osm"
*.tracer.osmOriginLatDeg = 22.7569500
*.tracer.osmOriginLonDeg = -102.6002500
*.tracer.txX = 1813.748m
*.tracer.txY = 490.000m
*.tracer.rxX = 1913.748m
*.tracer.rxY = 490.000m
*.tracer.enableGrid = false
*.tracer.enableLos = true
*.tracer.enableFirstOrderReflections = false
*.tracer.enableSecondOrderReflections = false
*.tracer.enableDiffraction = false
*.tracer.drawWallLabels = false
*.tracer.drawRayLabels = false
*.tracer.viewAutoFit = true
*.tracer.drawBuildingFootprints = true
*.tracer.fillBuildingFootprints = true
*.tracer.drawRawOsmWalls = false
*.tracer.gridOutputCsv = ""
*.tracer.outputCsv = "${resultdir}/UrbanStudentMapImportCheck-rays.csv"

# Local visual inspection around the thesis GW area.
# Physics stays in metres; only the Qtenv viewport is cropped.
[Config UrbanStudentMapVisualLocal]
extends = UrbanStudentMapImportCheck
description = "v1.5.1 local Qtenv viewport around the thesis GW area"

*.tracer.gridStepY = 5m
*.tracer.gridOutputCsv = "${resultdir}/Urban12_Grid5m-grid.csv"
*.tracer.outputCsv = "${resultdir}/Urban12_Grid5m-rays.csv"

# Material sensitivity.  These override every OSM surface without editing the
# file. Compare these only at the same frequency/polarization/geometry.
[Config Urban13_AllConcrete]
extends = Urban05_Full
description = "Sensitivity: force all OSM walls to concrete"

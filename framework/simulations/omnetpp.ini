*.tracer.outputCsv = "${resultdir}/FrequencySweepSingleReflection-rays.csv"

[Config Urban16_FrequencySweep]
extends = Urban05_Full
description = "v1.2 explicit urban RX frequency response; geometry fixed, 2.3--2.5 GHz"
*.tracer.enableFrequencySweep = true
*.tracer.sweepStartFrequency = 2.3GHz
*.tracer.sweepStopFrequency = 2.5GHz
*.tracer.sweepPoints = 201
*.tracer.frequencySweepOutputCsv = "${resultdir}/Urban16_FrequencySweep-frequency.csv"
*.tracer.gridOutputCsv = "${resultdir}/Urban16_FrequencySweep-grid.csv"
*.tracer.outputCsv = "${resultdir}/Urban16_FrequencySweep-rays.csv"

# ============================================================================
# v1.3 CONSERVATIVE PRE-TRACE DISTANCE PRUNING
# maxPathDistance now acts twice: a proven geometric lower bound rejects walls
# and ordered pairs before image tracing, and the historical exact path-length
# filter remains after propagation. The two stages must retain identical paths.
# ============================================================================
[Config Urban17_Pruned600m]
extends = Urban05_Full
description = "v1.3 conservative pre-trace pruning plus exact 600 m path filter"
*.tracer.maxPathDistance = 600m
*.tracer.gridOutputCsv = "${resultdir}/Urban17_Pruned600m-grid.csv"
*.tracer.outputCsv = "${resultdir}/Urban17_Pruned600m-rays.csv"

# ============================================================================
# POST-v1.5.1 ROADMAP / OPEN ITEMS
#   - validate phasor convention with more controlled multi-path cases;
#   - wall transmission/penetration;
#   - true 2D wedge/UTD diffraction instead of isolated knife-edge endpoints;
#   - OSM multipolygon relations and holes;
#   - spatial indexing/pruning BEFORE candidate generation (R-tree/quadtree);
#   - large-area GIS raster export;
#   - field-measurement validation (MAE/RMSE/bias);
#   - optional INET coupling after the propagation core is validated.
# ============================================================================

# ============================================================================
# v1.6 THESIS RELEASE - CONTROLLED CLOSURE CAMPAIGN
# ============================================================================
# PURPOSE
#   Freeze the 2D deterministic propagation model and collect the evidence
#   required to close the thesis development phase. The model is intended to be
#   described as analytically/numerically VERIFIED, but NOT experimentally
#   VALIDATED against independent field measurements.
#
# THESIS-RELEASE PHYSICS
#   - OSM closed-building geometry projected to local Cartesian metres.
#   - LoS/blockage.
#   - image-method R1 and ordered R2 specular reflections.
#   - Fresnel TE/TM material reflection.
#   - coherent/incoherent multipath combination.
#   - first-order 2D knife-edge D1 on UNIQUE geometric vertices.
#   - Pr, equivalent path loss, path counts and delay metrics.
#
# IMPORTANT v1.6 CORRECTION
#   D1 endpoints are deduplicated geometrically before diffraction paths are
#   added. In v1.5.1 a polygon corner could be represented by the end of one
#   wall and the start of the next, which could duplicate the same TX-edge-RX
#   path and over-count its power. R1/R2 are unaffected by this correction.
#   ALL D1-dependent v1.5.1 maps/results must therefore be regenerated in v1.6.
#
# EXPERIMENTAL RULE
#   Change one factor at a time. Keep geometry, TX/RX, frequency, polarization,
#   path guards and material assumptions fixed unless the config explicitly
#   declares that parameter as the variable under test.
#
# NO RAY-LAUNCH PARAMETERS
#   This is an image-method tracer. There is no angular launch step, angular
#   sampling interval or fixed number of launched rays. maxPathsPerReceiver is
#   a POST-TRACE retention guard, not a ray generator.
# ============================================================================

[Config Thesis_Zacatecas_Base]
extends = UrbanStudentMapVisualLocal
description = "v1.6 Thesis Release base: real Zacatecas OSM, fixed TX, 2.4 GHz TE coherent"

# FIXED GEOMETRY / RF REFERENCE
*.tracer.osmFile = "data/student/zacatecas_student.osm"
*.tracer.osmOriginLatDeg = 22.7569500
*.tracer.osmOriginLonDeg = -102.6002500
*.tracer.txX = 1838.748m
*.tracer.txY = 465m
*.tracer.rxX = 1938.748m
*.tracer.rxY = 215m
*.tracer.frequency = 2.4GHz
*.tracer.txPowerDbm = 14
*.tracer.reflectionModel = "fresnel"
*.tracer.polarization = "TE"
*.tracer.coherentCombination = true
*.tracer.osmDefaultMaterial = "concrete"
*.tracer.osmForceMaterial = ""

# REFERENCE GUARDS
# 500 m admits the previously characterized R2 detours while preventing an
# unbounded urban search. It is part of the experiment and MUST be reported.
*.tracer.maxPathDistance = 500m
*.tracer.minPathPowerDbm = -300
*.tracer.maxIncidenceAngleDeg = 90
*.tracer.maxPathsPerReceiver = 0

*.tracer.enableGrid = false
*.tracer.drawWallLabels = false
*.tracer.drawRayLabels = true
*.tracer.maxRayPathsToDraw = 24

# ---------------------------------------------------------------------------
# T BLOCK - CANONICAL LoS-R1-R2 REGRESSION LINK
# PURPOSE: protect the already-characterized urban multipath case while the
# thesis release evolves. Expected v1.5.1 reference before D1 correction:
# T02: 1 LoS + 4 R1 + 5 R2, Pr ~ -69.535 dBm, RMS ~57.66 ns.
# D1 is not involved because the direct link is LoS.
# ---------------------------------------------------------------------------
[Config Thesis_T00_LoS]
extends = Thesis_Zacatecas_Base
description = "T00 - canonical reference link: LoS only"
*.tracer.enableLos = true
*.tracer.enableFirstOrderReflections = false
*.tracer.enableSecondOrderReflections = false
*.tracer.enableDiffraction = false
*.tracer.outputCsv = "${resultdir}/Thesis_T00_LoS-rays.csv"

[Config Thesis_T01_LoS_R1]
extends = Thesis_Zacatecas_Base
description = "T01 - canonical reference link: LoS + R1"
*.tracer.enableLos = true
*.tracer.enableFirstOrderReflections = true
*.tracer.enableSecondOrderReflections = false
*.tracer.enableDiffraction = false
*.tracer.outputCsv = "${resultdir}/Thesis_T01_LoS_R1-rays.csv"

[Config Thesis_T02_LoS_R1R2]
extends = Thesis_Zacatecas_Base
description = "T02 - canonical urban regression: LoS + R1 + R2"
*.tracer.enableLos = true
*.tracer.enableFirstOrderReflections = true
*.tracer.enableSecondOrderReflections = true
*.tracer.enableDiffraction = false
*.tracer.outputCsv = "${resultdir}/Thesis_T02_LoS_R1R2-rays.csv"

# ---------------------------------------------------------------------------
# D BLOCK - CANONICAL NLoS / D1 CASE
# D00 is the reproducible discovery scan. The included selector script filters:
#   direct_blocked=1, diffraction_paths>0, finite power, RX outside building
#   footprints, then ranks candidates and writes a candidate CSV/INI snippet.
#
# v1.6 preflight selected RX=(1800,225) m because:
#   - direct is blocked,
#   - the point lies outside OSM building footprints,
#   - R1=0 and R2=0 under the declared 500 m guard,
#   - one UNIQUE D1 path survives after the v1.6 corner-dedup correction.
# This makes D04 a deliberately clean diffraction-excitation case.
# ---------------------------------------------------------------------------
[Config Thesis_D00_Find_NLoS_D1]
extends = Thesis_Zacatecas_Base
description = "D00 - 25 m discovery grid for a canonical blocked D1 receiver"
*.tracer.enableLos = true
*.tracer.enableFirstOrderReflections = true
*.tracer.enableSecondOrderReflections = true
*.tracer.enableDiffraction = true
*.tracer.enableGrid = true
*.tracer.gridMode = "raytracing"
*.tracer.gridMinX = 1750m
*.tracer.gridMaxX = 2050m
*.tracer.gridMinY = 150m
*.tracer.gridMaxY = 650m
*.tracer.gridStepX = 25m
*.tracer.gridStepY = 25m
*.tracer.drawScene = false
*.tracer.gridOutputCsv = "${resultdir}/Thesis_D00_Find_NLoS_D1-grid.csv"
*.tracer.outputCsv = "${resultdir}/Thesis_D00_Find_NLoS_D1-rays.csv"

[Config Thesis_D01_NLoS_Blockage]
extends = Thesis_Zacatecas_Base
description = "D01 - canonical NLoS receiver: direct path only, expected blocked/no path"
*.tracer.rxX = 1800m
*.tracer.rxY = 225m
*.tracer.enableLos = true
*.tracer.enableFirstOrderReflections = false
*.tracer.enableSecondOrderReflections = false
*.tracer.enableDiffraction = false
*.tracer.outputCsv = "${resultdir}/Thesis_D01_NLoS_Blockage-rays.csv"

[Config Thesis_D02_NLoS_R1]
extends = Thesis_D01_NLoS_Blockage
description = "D02 - same NLoS receiver: enable R1 only"
*.tracer.enableFirstOrderReflections = true
*.tracer.outputCsv = "${resultdir}/Thesis_D02_NLoS_R1-rays.csv"

[Config Thesis_D03_NLoS_R1R2]
extends = Thesis_D02_NLoS_R1
description = "D03 - same NLoS receiver: enable R1 + R2"
*.tracer.enableSecondOrderReflections = true
*.tracer.outputCsv = "${resultdir}/Thesis_D03_NLoS_R1R2-rays.csv"

[Config Thesis_D04_NLoS_FULL]
extends = Thesis_D03_NLoS_R1R2
description = "D04 - canonical NLoS diffraction case: R1 + R2 + unique-vertex knife-edge D1"
*.tracer.enableDiffraction = true
*.tracer.outputCsv = "${resultdir}/Thesis_D04_NLoS_FULL-rays.csv"

# ---------------------------------------------------------------------------
# A BLOCK - SPATIAL ABLATION AT 25 m
# PURPOSE: quantify how many receivers become geometrically solvable when
# complexity increases. 'Finite' means >=1 retained model path, NOT receiver
# sensitivity coverage or packet-delivery probability.
# ---------------------------------------------------------------------------
[Config Thesis_A10_LoS_25m]
extends = Thesis_Zacatecas_Base
description = "A10 - 25 m spatial ablation: LoS/blockage only"
*.tracer.enableLos = true
*.tracer.enableFirstOrderReflections = false
*.tracer.enableSecondOrderReflections = false
*.tracer.enableDiffraction = false
*.tracer.enableGrid = true
*.tracer.gridMode = "raytracing"
*.tracer.gridMinX = 1750m
*.tracer.gridMaxX = 2050m
*.tracer.gridMinY = 150m
*.tracer.gridMaxY = 650m
*.tracer.gridStepX = 25m
*.tracer.gridStepY = 25m
*.tracer.gridOutputCsv = "${resultdir}/Thesis_A10_LoS_25m-grid.csv"
*.tracer.outputCsv = "${resultdir}/Thesis_A10_LoS_25m-rays.csv"

[Config Thesis_A11_LoS_R1_25m]
extends = Thesis_A10_LoS_25m
description = "A11 - 25 m spatial ablation: LoS + R1"
*.tracer.enableFirstOrderReflections = true
*.tracer.gridOutputCsv = "${resultdir}/Thesis_A11_LoS_R1_25m-grid.csv"
*.tracer.outputCsv = "${resultdir}/Thesis_A11_LoS_R1_25m-rays.csv"

[Config Thesis_A12_FULL_25m]
extends = Thesis_A11_LoS_R1_25m
description = "A12 - 25 m spatial ablation: LoS + R1 + R2 + unique-vertex D1"
*.tracer.enableSecondOrderReflections = true
*.tracer.enableDiffraction = true
*.tracer.gridOutputCsv = "${resultdir}/Thesis_A12_FULL_25m-grid.csv"
*.tracer.outputCsv = "${resultdir}/Thesis_A12_FULL_25m-rays.csv"

# ---------------------------------------------------------------------------
# M BLOCK - FINAL THESIS MAP DATA / SPATIAL CONVERGENCE
# PURPOSE: same area and physics, nested 50/25/10 m grids.
# M10 is the final local working resolution. Do NOT add 5 m as a thesis-release
# requirement unless a new research question justifies it.
#
# One M10 CSV contains the data for THREE final figures without retracing:
#   1) received_power_dbm -> Pr(x,y)
#   2) retained_paths     -> Npaths(x,y)
#   3) rms_delay_spread_ns -> tau_RMS(x,y)
# Use scripts/plot_thesis_maps.py.
# ---------------------------------------------------------------------------
[Config Thesis_M50_FULL_50m]
extends = Thesis_A12_FULL_25m
description = "M50 - FULL model, 50 m nested grid"
*.tracer.gridStepX = 50m
*.tracer.gridStepY = 50m
*.tracer.gridOutputCsv = "${resultdir}/Thesis_M50_FULL_50m-grid.csv"
*.tracer.outputCsv = "${resultdir}/Thesis_M50_FULL_50m-rays.csv"

[Config Thesis_M25_FULL_25m]
extends = Thesis_A12_FULL_25m
description = "M25 - FULL model, 25 m nested grid"
*.tracer.gridOutputCsv = "${resultdir}/Thesis_M25_FULL_25m-grid.csv"
*.tracer.outputCsv = "${resultdir}/Thesis_M25_FULL_25m-rays.csv"

[Config Thesis_M10_FULL_10m]
extends = Thesis_A12_FULL_25m
description = "M10 - FINAL local thesis map data, FULL model at 10 m"
*.tracer.gridStepX = 10m
*.tracer.gridStepY = 10m
*.tracer.gridOutputCsv = "${resultdir}/Thesis_M10_FULL_10m-grid.csv"
*.tracer.outputCsv = "${resultdir}/Thesis_M10_FULL_10m-rays.csv"

# ---------------------------------------------------------------------------
# P BLOCK - POLARIZATION / PHASE
# PURPOSE: one-factor controls on the canonical T02 multipath link.
# DO NOT CLAIM that TE or TM is globally superior from one receiver.
# ---------------------------------------------------------------------------
[Config Thesis_P01_TE_Coherent]
extends = Thesis_T02_LoS_R1R2
description = "P01 - TE coherent reference (same as T02 physics)"
*.tracer.polarization = "TE"
*.tracer.coherentCombination = true
*.tracer.outputCsv = "${resultdir}/Thesis_P01_TE_Coherent-rays.csv"

[Config Thesis_P02_TM_Coherent]
extends = Thesis_P01_TE_Coherent
description = "P02 - change ONLY Fresnel polarization TE -> TM"
*.tracer.polarization = "TM"
*.tracer.outputCsv = "${resultdir}/Thesis_P02_TM_Coherent-rays.csv"

[Config Thesis_P03_TE_Incoherent]
extends = Thesis_P01_TE_Coherent
description = "P03 - change ONLY coherent -> incoherent path-power combination"
*.tracer.coherentCombination = false
*.tracer.outputCsv = "${resultdir}/Thesis_P03_TE_Incoherent-rays.csv"

# ---------------------------------------------------------------------------
# F BLOCK - FREQUENCY SENSITIVITY
# F02 is continuity with the earlier LoRa context, NOT validation of the
# material catalog at 916 MHz. Inspect material_model_in_range in every path.
# ---------------------------------------------------------------------------
[Config Thesis_F01_2400MHz]
extends = Thesis_T02_LoS_R1R2
description = "F01 - 2.4 GHz reference frequency"
*.tracer.frequency = 2.4GHz
*.tracer.outputCsv = "${resultdir}/Thesis_F01_2400MHz-rays.csv"

[Config Thesis_F02_916MHz]
extends = Thesis_F01_2400MHz
description = "F02 - frequency sensitivity at 916 MHz; material extrapolation may occur"
*.tracer.frequency = 916MHz
*.tracer.outputCsv = "${resultdir}/Thesis_F02_916MHz-rays.csv"

# ---------------------------------------------------------------------------
# G BLOCK - INCIDENCE-ANGLE GUARD SENSITIVITY
# maxIncidenceAngleDeg is a MODEL/NUMERICAL GUARD, not a material constant.
# Angles are measured from wall normal; 90 deg admits grazing paths.
# ---------------------------------------------------------------------------
[Config Thesis_G01_Angle90]
extends = Thesis_T02_LoS_R1R2
description = "G01 - reference angle guard = 90 deg"
*.tracer.maxIncidenceAngleDeg = 90
*.tracer.outputCsv = "${resultdir}/Thesis_G01_Angle90-rays.csv"

[Config Thesis_G02_Angle75]
extends = Thesis_G01_Angle90
description = "G02 - sensitivity: reject reflections above 75 deg from wall normal"
*.tracer.maxIncidenceAngleDeg = 75
*.tracer.outputCsv = "${resultdir}/Thesis_G02_Angle75-rays.csv"

[Config Thesis_G03_Angle60]
extends = Thesis_G01_Angle90
description = "G03 - sensitivity: reject reflections above 60 deg from wall normal"
*.tracer.maxIncidenceAngleDeg = 60
*.tracer.outputCsv = "${resultdir}/Thesis_G03_Angle60-rays.csv"

# ---------------------------------------------------------------------------
# S BLOCK - SMALL MATERIAL/RECEIVER PANEL AT 2.4 GHz
# PURPOSE: avoid inferring material sensitivity from a single receiver.
# Three receiver roles are frozen from the v1.6 25 m preflight:
#   R1: (1775,150) -> LoS + R1, no R2/D1 under FULL/500 m.
#   R2: (1750,150) -> LoS + R1 + R2, no D1 under FULL/500 m.
#   D1: (1800,225) -> blocked, unique D1 only after v1.6 dedup.
# For each role compare original OSM tags/fallback, all-concrete, all-glass.
# D1 is intentionally a negative material control because the current knife-
# edge loss does not use wall material properties.
# ---------------------------------------------------------------------------
[Config Thesis_S_R1_Original]
extends = Thesis_Zacatecas_Base
description = "S-R1 original materials at receiver (1775,150)"
*.tracer.rxX = 1775m
*.tracer.rxY = 150m
*.tracer.enableLos = true
*.tracer.enableFirstOrderReflections = true
*.tracer.enableSecondOrderReflections = true
*.tracer.enableDiffraction = true
*.tracer.osmForceMaterial = ""
*.tracer.outputCsv = "${resultdir}/Thesis_S_R1_Original-rays.csv"

[Config Thesis_S_R1_Concrete]
extends = Thesis_S_R1_Original
description = "S-R1 force all OSM surfaces to concrete"
*.tracer.osmForceMaterial = "concrete"
*.tracer.outputCsv = "${resultdir}/Thesis_S_R1_Concrete-rays.csv"

[Config Thesis_S_R1_Glass]
extends = Thesis_S_R1_Original
description = "S-R1 force all OSM surfaces to glass"
*.tracer.osmForceMaterial = "glass"
*.tracer.outputCsv = "${resultdir}/Thesis_S_R1_Glass-rays.csv"

[Config Thesis_S_R2_Original]
extends = Thesis_S_R1_Original
description = "S-R2 original materials at receiver (1750,150)"
*.tracer.rxX = 1750m
*.tracer.rxY = 150m
*.tracer.osmForceMaterial = ""
*.tracer.outputCsv = "${resultdir}/Thesis_S_R2_Original-rays.csv"

[Config Thesis_S_R2_Concrete]
extends = Thesis_S_R2_Original
description = "S-R2 force all OSM surfaces to concrete"
*.tracer.osmForceMaterial = "concrete"
*.tracer.outputCsv = "${resultdir}/Thesis_S_R2_Concrete-rays.csv"

[Config Thesis_S_R2_Glass]
extends = Thesis_S_R2_Original
description = "S-R2 force all OSM surfaces to glass"
*.tracer.osmForceMaterial = "glass"
*.tracer.outputCsv = "${resultdir}/Thesis_S_R2_Glass-rays.csv"

[Config Thesis_S_D1_Original]
extends = Thesis_D04_NLoS_FULL
description = "S-D1 original materials; negative material control for current knife-edge model"
*.tracer.osmForceMaterial = ""
*.tracer.outputCsv = "${resultdir}/Thesis_S_D1_Original-rays.csv"

[Config Thesis_S_D1_Concrete]
extends = Thesis_S_D1_Original
description = "S-D1 all concrete; expected unchanged if only D1 survives"
*.tracer.osmForceMaterial = "concrete"
*.tracer.outputCsv = "${resultdir}/Thesis_S_D1_Concrete-rays.csv"

[Config Thesis_S_D1_Glass]
extends = Thesis_S_D1_Original
description = "S-D1 all glass; expected unchanged if only D1 survives"
*.tracer.osmForceMaterial = "glass"
*.tracer.outputCsv = "${resultdir}/Thesis_S_D1_Glass-rays.csv"


# ============================================================================
# RayTracing2D - OMNeT++ project
# Version 1.6 Thesis Release - verified core + controlled thesis closure campaign
#
# PURPOSE OF THIS FILE
#   This INI is both executable configuration and experimental protocol.
#   Change ONE family of parameters at a time and preserve the generated CSV
#   and .sca files. Every non-default pruning/cutoff must be reported.
#
# CURRENT CORE SCOPE (v1.6)
#   - OMNeT++ core project; INET/FLoRa are not required by the main model.
#   - local 2D Cartesian geometry and OSM closed-building ways.
#   - direct LoS/blockage.
#   - first- and ordered second-order specular reflections (image method).
#   - Fresnel TE/TM reflection using material permittivity/conductivity.
#   - isolated first-order knife-edge diffraction at unique finite-wall vertices.
#   - coherent or incoherent multipath combination.
#   - grid evaluation, Pr(x,y), equivalent path loss, path counts and delays.
#   - Qtenv heatmaps for received power, path count and RMS delay spread.
#   - CSV/scalars with candidate counts and execution time.
#
# IMPORTANT PHYSICAL INTERPRETATION
#   * This is IMAGE-METHOD ray tracing. There is NO angular launch step and no
#     fixed number of rays to launch. Candidate paths are generated from the
#     finite surfaces. Incidence angles are calculated from geometry.
#   * Material mass density is NOT used. Reflection uses relative permittivity
#     and conductivity. Current material catalog: generic, concrete, brick,
#     plasterboard, wood, glass, metal.
#   * Diffraction is a controlled knife-edge approximation, NOT full UTD.
#   * No wall transmission/penetration is implemented in v1.1.
#   * OSM multipolygon relations and building holes are not yet supported.
#
# CONTROLLED URBAN SCIENTIFIC EXPERIMENT
#   Same urban geometry and grid, progressively enable:
#      Urban01_FSPL        -> free-space baseline
#      Urban02_Blockage    -> LoS + geometric blocking
#      Urban03_R1          -> + first-order reflection
#      Urban04_R1R2        -> + second-order reflection
#      Urban05_Full        -> + knife-edge diffraction
#   This isolates what each propagation mechanism contributes.
# ============================================================================

[General]
network = RayTracingScenario

result-dir = results
output-scalar-file = "${resultdir}/${configname}-${runnumber}.sca"
output-vector-file = "${resultdir}/${configname}-${runnumber}.vec"

# ----------------------------------------------------------------------------
# GLOBAL RF PARAMETERS
# ----------------------------------------------------------------------------
# 2.4 GHz is the reference frequency for v1.1 urban Fresnel experiments because
# it lies inside the declared validity interval of the concrete/brick models.
# A separate 916 MHz exploratory configuration is provided below; at 916 MHz
# some material laws are extrapolated and the software flags this condition.
*.tracer.frequency = 2.4GHz
*.tracer.txPowerDbm = 14

# Fresnel is the v1.1 physical reflection mode.
*.tracer.reflectionModel = "fresnel"
*.tracer.polarization = "TE"
*.tracer.coherentCombination = true

# Fixed reflection parameters are read ONLY if reflectionModel="fixed".
*.tracer.reflectionLossDb = 6
*.tracer.reflectionPhaseShiftDeg = 180

# ----------------------------------------------------------------------------
# RAY MECHANISMS
# ----------------------------------------------------------------------------
*.tracer.enableLos = true
*.tracer.enableFirstOrderReflections = true
*.tracer.enableSecondOrderReflections = false
*.tracer.enableDiffraction = false

# ----------------------------------------------------------------------------
# PATH SELECTION / SCALABILITY GUARDRAILS
# ----------------------------------------------------------------------------
# These do NOT control a ray-launch angular discretization. They filter already
# valid image-method paths. Defaults keep essentially everything.
#
# maxPathsPerReceiver:
#   0 = keep all valid paths.
#   Example for a large map: 32 or 64 strongest paths.
#
# minPathPowerDbm:
#   Discard individual contributions weaker than this value. -300 disables it
#   in practice. Examples to test later: -160, -150, -140 dBm.
#
# maxPathDistance:
#   0m = unlimited. A value such as 600m rejects longer detours AFTER tracing.
#
# maxIncidenceAngleDeg:
#   Angle is measured from the wall normal. 90 deg means no rejection.
#   Values such as 85-89 deg may remove near-grazing paths, but changing this
#   alters the model and must be reported.
*.tracer.maxPathsPerReceiver = 0
*.tracer.minPathPowerDbm = -300
*.tracer.maxPathDistance = 0m
*.tracer.maxIncidenceAngleDeg = 90

# ----------------------------------------------------------------------------
# OSM / MATERIAL PARAMETERS
# ----------------------------------------------------------------------------
*.tracer.osmFile = ""
*.tracer.osmOriginLatDeg = 0
*.tracer.osmOriginLonDeg = 0
*.tracer.osmDefaultMaterial = "concrete"
# Empty: use normalized OSM building:material tags.
# Set to concrete/brick/glass/wood/metal/plasterboard/generic to force all OSM
# surfaces to one material for a CONTROLLED sensitivity experiment. This
# changes epsilon_r(f) and sigma(f), not mass density.
*.tracer.osmForceMaterial = ""

# Manual walls may be combined with OSM walls. Leave empty for OSM-only scenes.
*.tracer.walls = ""

# ----------------------------------------------------------------------------
# GRID / HEATMAP PARAMETERS
# ----------------------------------------------------------------------------
*.tracer.enableGrid = false
*.tracer.gridMode = "raytracing"
*.tracer.gridOutputCsv = ""

# Heatmap metric options:
#   receivedPowerDbm -> total combined Pr(x,y)
#   pathCount        -> number of retained resolved paths
#   rmsDelayNs       -> RMS delay spread of the resolved power-delay profile
*.tracer.heatmapMetric = "receivedPowerDbm"
*.tracer.heatmapMinDbm = -120
*.tracer.heatmapMaxDbm = -35
*.tracer.heatmapPathCountMax = 12
*.tracer.heatmapDelaySpreadMaxNs = 1000

# ----------------------------------------------------------------------------
# NUMERICAL / QTENV
# ----------------------------------------------------------------------------
*.tracer.numericalTolerance = 1e-8
*.tracer.drawScene = true

# COORDINATE CONTRACT (v1.5.1)
#   Physics / CSV / ray tracer:
#       local Cartesian metres, +X=east, +Y=north.
#   Qtenv cCanvas:
#       visual canvas units. It is NOT the geographic coordinate system and it
#       must not be used as physical distance. RayTracing2D maps world metres to
#       canvas units only while drawing.
#
# viewAutoFit=true fits walls + TX/RX + enabled grid to the visual viewport.
# viewNorthUp=true inverts the visual Y axis so geographic north is at the top.
# Change viewAutoFit=false only when inspecting a local urban window; in that
# case specify viewWorldMin/Max*. These parameters affect DISPLAY ONLY.
*.tracer.viewAutoFit = true
*.tracer.viewCanvasWidth = 1200
*.tracer.viewCanvasHeight = 800
*.tracer.viewMargin = 35
*.tracer.viewNorthUp = true
*.tracer.viewWorldMinX = 0m
*.tracer.viewWorldMaxX = 1000m
*.tracer.viewWorldMinY = 0m
*.tracer.viewWorldMaxY = 1000m

# OSM visual layer. Building footprints are reconstructed from the same finite
# walls used by the ray tracer. Raw OSM wall segments are optional debug output.
*.tracer.drawBuildingFootprints = true
*.tracer.fillBuildingFootprints = true
*.tracer.drawRawOsmWalls = false
*.tracer.drawMapDecorations = true

*.tracer.drawWallLabels = true
*.tracer.drawRayLabels = true
*.tracer.maxRayPathsToDraw = 0

# These are VISUAL canvas-unit sizes, not metres.
*.tracer.markerRadius = 6
*.tracer.summaryX = 12
*.tracer.summaryY = 12
*.tracer.outputCsv = ""

